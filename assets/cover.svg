<svg width="800" height="1100" viewBox="0 0 800 1100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Book cover for Quantitative Analysis with Small Samples">
  <rect width="800" height="1100" fill="#F5F0E8"/>

  <text x="400" y="118" fill="#1B2A4A" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="700" text-anchor="middle">
    <tspan x="400" dy="0">Quantitative Analysis</tspan>
    <tspan x="400" dy="64">with Small Samples</tspan>
  </text>

  <line x1="370" y1="262" x2="430" y2="262" stroke="#2E7D6E" stroke-width="2"/>

  <text x="400" y="306" fill="#2E7D6E" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-style="italic" text-anchor="middle">
    A Practical Guide for Students and Early-Career Researchers
  </text>

  <g transform="translate(150, 350)">
    <line x1="60" y1="276" x2="480" y2="276" stroke="#C8C0B0" stroke-width="1"/>
    <line x1="270" y1="10" x2="270" y2="276" stroke="#2E7D6E" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="270" y="292" font-family="Georgia, 'Times New Roman', serif" font-size="10" fill="#1B2A4A" text-anchor="middle">&#952;</text>
    <text x="270" y="308" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#1B2A4A" text-anchor="middle">Estimated Effect</text>
    <text x="14" y="148" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#1B2A4A" text-anchor="middle" transform="rotate(-90, 14, 148)">Sample Size</text>

    <text x="56" y="32" font-family="Georgia, 'Times New Roman', serif" font-size="10" fill="#1B2A4A" text-anchor="end" dominant-baseline="middle">n = 8</text>
    <line x1="148" y1="28" x2="408" y2="28" stroke="#1B2A4A" stroke-width="1.5"/>
    <line x1="148" y1="21" x2="148" y2="35" stroke="#1B2A4A" stroke-width="1.5"/>
    <line x1="408" y1="21" x2="408" y2="35" stroke="#1B2A4A" stroke-width="1.5"/>
    <circle cx="278" cy="28" r="4.5" fill="#1B2A4A"/>

    <text x="56" y="73" font-family="Georgia, 'Times New Roman', serif" font-size="10" fill="#1B2A4A" text-anchor="end" dominant-baseline="middle">n = 12</text>
    <line x1="158" y1="73" x2="370" y2="73" stroke="#1B2A4A" stroke-width="1.5"/>
    <line x1="158" y1="66" x2="158" y2="80" stroke="#1B2A4A" stroke-width="1.5"/>
    <line x1="370" y1="66" x2="370" y2="80" stroke="#1B2A4A" stroke-width="1.5"/>
    <circle cx="264" cy="73" r="4.5" fill="#1B2A4A"/>

    <text x="56" y="118" font-family="Georgia, 'Times New Roman', serif" font-size="10" fill="#1B2A4A" text-anchor="end" dominant-baseline="middle">n = 18</text>
    <line x1="188" y1="118" x2="360" y2="118" stroke="#1B2A4A" stroke-width="1.5"/>
    <line x1="188" y1="111" x2="188" y2="125" stroke="#1B2A4A" stroke-width="1.5"/>
    <line x1="360" y1="111" x2="360" y2="125" stroke="#1B2A4A" stroke-width="1.5"/>
    <circle cx="274" cy="118" r="4.5" fill="#1B2A4A"/>

    <text x="56" y="163" font-family="Georgia, 'Times New Roman', serif" font-size="10" fill="#1B2A4A" text-anchor="end" dominant-baseline="middle">n = 25</text>
    <line x1="195" y1="163" x2="335" y2="163" stroke="#1B2A4A" stroke-width="1.5"/>
    <line x1="195" y1="156" x2="195" y2="170" stroke="#1B2A4A" stroke-width="1.5"/>
    <line x1="335" y1="156" x2="335" y2="170" stroke="#1B2A4A" stroke-width="1.5"/>
    <circle cx="265" cy="163" r="4.5" fill="#1B2A4A"/>

    <text x="56" y="208" font-family="Georgia, 'Times New Roman', serif" font-size="10" fill="#1B2A4A" text-anchor="end" dominant-baseline="middle">n = 35</text>
    <line x1="215" y1="208" x2="331" y2="208" stroke="#1B2A4A" stroke-width="1.5"/>
    <line x1="215" y1="201" x2="215" y2="215" stroke="#1B2A4A" stroke-width="1.5"/>
    <line x1="331" y1="201" x2="331" y2="215" stroke="#1B2A4A" stroke-width="1.5"/>
    <circle cx="273" cy="208" r="4.5" fill="#1B2A4A"/>

    <text x="56" y="253" font-family="Georgia, 'Times New Roman', serif" font-size="10" fill="#1B2A4A" text-anchor="end" dominant-baseline="middle">n = 50</text>
    <line x1="224" y1="253" x2="316" y2="253" stroke="#1B2A4A" stroke-width="1.5"/>
    <line x1="224" y1="246" x2="224" y2="260" stroke="#1B2A4A" stroke-width="1.5"/>
    <line x1="316" y1="246" x2="316" y2="260" stroke="#1B2A4A" stroke-width="1.5"/>
    <circle cx="270" cy="253" r="4.5" fill="#1B2A4A"/>
  </g>

  <text x="400" y="690" fill="#1B2A4A" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-style="italic" text-anchor="middle">Confidence Intervals by Sample Size: Uncertainty Narrows as n Grows</text>

  <line x1="370" y1="744" x2="430" y2="744" stroke="#2E7D6E" stroke-width="2"/>

  <g fill="#1B2A4A" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="400" text-anchor="middle">
    <text x="400" y="806">Mohammed Ali Sharafuddin</text>
    <text x="400" y="846">Ahsan Ahmed Jaleel</text>
    <text x="400" y="886">Meena Madhavan</text>
  </g>

  <text x="400" y="954" fill="#1B2A4A" font-family="Georgia, 'Times New Roman', serif" font-size="11" text-anchor="middle" letter-spacing="3">R <tspan fill="#2E7D6E">&#183;</tspan> QUARTO <tspan fill="#2E7D6E">&#183;</tspan> REPRODUCIBLE RESEARCH <tspan fill="#2E7D6E">&#183;</tspan> APPLIED STATISTICS</text>
</svg>
